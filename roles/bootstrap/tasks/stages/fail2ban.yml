---
- name: Stage 5 - fail2ban
  block:
    - name: Install fail2ban
      package:
        name: fail2ban
        state: present
      when: not bootstrap_skip_fail2ban | bool and not bootstrap_dry_run

    - name: Create fail2ban jail config
      template:
        src: fail2ban-sshd.conf.j2
        dest: /etc/fail2ban/jail.d/00-linux-server-bootstrap.conf
        owner: root
        group: root
        mode: '0644'
      when: not bootstrap_skip_fail2ban | bool and not bootstrap_dry_run
      notify: restart fail2ban

    - name: Enable and start fail2ban
      service:
        name: fail2ban
        enabled: true
        state: started
      when: not bootstrap_skip_fail2ban | bool and not bootstrap_dry_run

  tags: ['fail2ban']
  rescue:
    - name: fail2ban stage failed
      fail:
        msg: "fail2ban configuration failed"
