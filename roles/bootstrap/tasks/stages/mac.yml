---
- name: Stage 10 - MAC (AppArmor/SELinux)
  block:
    - name: Configure AppArmor (Debian)
      block:
        - name: Install AppArmor
          package:
            name:
              - apparmor
              - apparmor-utils
            state: present
        - name: Enable AppArmor
          service:
            name: apparmor
            enabled: true
            state: started
          ignore_errors: true
      when: bootstrap_mac_system == 'apparmor' and bootstrap_install_mac | bool and (not bootstrap_dry_run | bool)

    - name: Configure SELinux (RHEL/SUSE)
      block:
        - name: Check SELinux status
          command: getenforce
          register: selinux_status
          changed_when: false
          failed_when: false
        - name: Set SELinux to enforcing
          selinux:
            policy: targeted
            state: enforcing
          when: selinux_status.stdout is defined and 'Enforcing' not in selinux_status.stdout and selinux_status.rc == 0
        - name: Install policy tools
          package:
            name: "{{ 'policycoreutils-python-utils' if bootstrap_family == 'rhel' else 'policycoreutils' }}"
            state: present
          when: bootstrap_family == 'rhel'
          ignore_errors: true
      when: bootstrap_mac_system == 'selinux' and bootstrap_install_mac | bool and (not bootstrap_dry_run | bool)
      ignore_errors: true

  tags: ['mac']
  rescue:
    - name: MAC stage failed
      fail:
        msg: "MAC configuration failed"
