---
- name: Stage 10 - MAC (AppArmor/SELinux)
  block:
    - name: Configure AppArmor (Debian)
      block:
        - name: Install AppArmor
          package:
            name:
              - apparmor
              - apparmor-utils
            state: present
        - name: Enable AppArmor
          service:
            name: apparmor
            enabled: true
            state: started
      when: bootstrap_mac_system == 'apparmor' and bootstrap_install_mac | bool and not bootstrap_dry_run

    - name: Configure SELinux (RHEL/SUSE)
      block:
        - name: Set SELinux to enforcing
          selinux:
            policy: targeted
            state: enforcing
          when: ansible_selinux.status == 'enabled'
        - name: Install policy tools
          package:
            name: policycoreutils-python-utils
            state: present
          when: bootstrap_family == 'rhel'
      when: bootstrap_mac_system == 'selinux' and bootstrap_install_mac | bool and not bootstrap_dry_run
      ignore_errors: true

  tags: ['mac']
  rescue:
    - name: MAC stage failed
      fail:
        msg: "MAC configuration failed"
