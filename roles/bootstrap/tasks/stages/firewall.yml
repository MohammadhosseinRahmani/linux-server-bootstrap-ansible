---
- name: Stage 4 - Firewall
  block:
    - name: Create backup timestamp
      set_fact:
        bootstrap_backup_ts: "{{ ansible_date_time.epoch }}"

    - name: Install firewall (Debian/ufw)
      apt:
        name: ufw
        state: present
        update_cache: yes
      when: bootstrap_firewall == 'ufw' and bootstrap_family == 'debian' and (not bootstrap_skip_firewall | bool) and (not bootstrap_dry_run | bool)

    - name: Install firewalld (RHEL/SUSE)
      package:
        name: firewalld
        state: present
      when: bootstrap_firewall == 'firewalld' and (not bootstrap_skip_firewall | bool) and (not bootstrap_dry_run | bool)

    - name: Backup firewall rules (ufw)
      shell: |
        mkdir -p {{ bootstrap_backup_root }}/firewall/{{ bootstrap_backup_ts }}
        ufw status verbose > {{ bootstrap_backup_root }}/firewall/{{ bootstrap_backup_ts }}/ufw_status.txt 2>&1 || true
      changed_when: false
      when: bootstrap_firewall == 'ufw' and (not bootstrap_skip_firewall | bool) and (not bootstrap_dry_run | bool)

    - name: Backup firewall rules (firewalld)
      shell: |
        mkdir -p {{ bootstrap_backup_root }}/firewall/{{ bootstrap_backup_ts }}
        firewall-cmd --list-all-zones > {{ bootstrap_backup_root }}/firewall/{{ bootstrap_backup_ts }}/firewalld_status.txt 2>&1 || true
      changed_when: false
      when: bootstrap_firewall == 'firewalld' and (not bootstrap_skip_firewall | bool) and (not bootstrap_dry_run | bool)

    - name: Configure ufw
      block:
        - name: Set ufw defaults
          ufw:
            direction: incoming
            policy: deny
        - name: Set ufw outgoing default
          ufw:
            direction: outgoing
            policy: allow
        - name: Allow SSH port
          ufw:
            rule: allow
            port: "{{ bootstrap_ssh_port }}"
            proto: tcp
            comment: "linux-server-bootstrap ssh"
        - name: Enable ufw
          ufw:
            state: enabled
      when: bootstrap_firewall == 'ufw' and (not bootstrap_skip_firewall | bool) and (not bootstrap_dry_run | bool)

    - name: Configure firewalld
      block:
        - name: Start and enable firewalld
          service:
            name: firewalld
            state: started
            enabled: true
        - name: Allow SSH port
          firewalld:
            port: "{{ bootstrap_ssh_port }}/tcp"
            permanent: true
            state: enabled
            immediate: true
        - name: Allow SSH service if defined
          firewalld:
            service: ssh
            permanent: true
            state: enabled
            immediate: true
          ignore_errors: true
      when: bootstrap_firewall == 'firewalld' and (not bootstrap_skip_firewall | bool) and (not bootstrap_dry_run | bool)

  tags: ['firewall']
  rescue:
    - name: Firewall stage failed
      fail:
        msg: "Firewall configuration failed"
