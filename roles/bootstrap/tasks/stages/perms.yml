---
- name: Stage 8 - permissions
  block:
    - name: Secure shadow files
      file:
        path: "{{ item.path }}"
        mode: "{{ item.mode }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
      loop:
        - { path: '/etc/shadow', mode: '0640', owner: 'root', group: 'shadow' }
        - { path: '/etc/gshadow', mode: '0640', owner: 'root', group: 'shadow' }
        - { path: '/etc/passwd', mode: '0644', owner: 'root', group: 'root' }
        - { path: '/etc/group', mode: '0644', owner: 'root', group: 'root' }
      ignore_errors: true
      when: not bootstrap_dry_run

    - name: Secure SSH keys and config
      file:
        path: /etc/ssh/sshd_config
        mode: '0600'
        owner: root
        group: root
      when: not bootstrap_dry_run

    - name: Secure sudoers.d
      file:
        path: /etc/sudoers.d
        mode: '0750'
        owner: root
        group: root
      when: not bootstrap_dry_run

  tags: ['perms']
  rescue:
    - name: perms stage failed
      fail:
        msg: "permissions hardening failed"
