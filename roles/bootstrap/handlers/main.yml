---
# Handlers for bootstrap role
- name: restart sshd
  service:
    name: "{{ bootstrap_sshd_service }}"
    state: restarted
  when: bootstrap_is_systemd or ansible_service_mgr != 'none'

- name: reload sshd
  service:
    name: "{{ bootstrap_sshd_service }}"
    state: reloaded
  when: bootstrap_is_systemd or ansible_service_mgr != 'none'

- name: restart firewalld
  service:
    name: firewalld
    state: restarted
  when: bootstrap_firewall == 'firewalld'

- name: reload firewalld
  service:
    name: firewalld
    state: reloaded
  when: bootstrap_firewall == 'firewalld'

- name: restart ufw
  service:
    name: ufw
    state: restarted
  when: bootstrap_firewall == 'ufw'

- name: reload ufw
  shell: ufw reload
  when: bootstrap_firewall == 'ufw'
  changed_when: true

- name: restart fail2ban
  service:
    name: fail2ban
    state: restarted

- name: restart auditd
  service:
    name: auditd
    state: restarted
  when: bootstrap_is_systemd

- name: restart rsyslog
  service:
    name: rsyslog
    state: restarted

- name: reload sysctl
  shell: sysctl --system
  changed_when: true
