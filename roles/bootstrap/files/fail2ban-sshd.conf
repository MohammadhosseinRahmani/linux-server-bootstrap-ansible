# linux-server-bootstrap fail2ban jail
# Installed as /etc/fail2ban/jail.d/00-linux-server-bootstrap.conf
# hardening/fail2ban.sh substitutes the tokens.

[sshd]
enabled = true
filter = sshd
port = __SSH_PORT__
backend = __BAN_BACKEND__
maxretry = 3
findtime = 600
bantime = 3600
banaction = __BAN_ACTION__
