# linux-server-bootstrap login limits
# Installed as /etc/security/limits.d/99-linux-server-bootstrap.conf
#
# hardening/limits.sh substitutes the core size token and appends a maxlogins
# line only when --max-logins is given.
#
# A core dump holds whatever the process had in memory, including keys and
# password material, so the hard limit is off by default.

*		soft	core		__CORE_LIMIT__
*		hard	core		__CORE_LIMIT__
root	soft	core		__CORE_LIMIT__
root	hard	core		__CORE_LIMIT__
