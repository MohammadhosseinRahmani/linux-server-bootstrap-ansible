# linux-server-bootstrap SSH drop-in
# Installed as /etc/ssh/sshd_config.d/00-linux-server-bootstrap.conf
#
# OpenSSH keeps the first value it sees for each keyword. The 00- prefix
# makes this file sort before distro snippets such as 50-redhat.conf.
# hardening/ssh.sh substitutes the tokens and appends algorithm lines
# that this sshd build actually supports.

Port __SSH_PORT__

PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
AuthenticationMethods publickey
PermitEmptyPasswords no
PermitUserEnvironment no
AllowUsers __SSH_ALLOW_USER__

MaxAuthTries 3
MaxSessions 4
MaxStartups 10:30:60
LoginGraceTime 30

ClientAliveInterval 300
ClientAliveCountMax 2

X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
GatewayPorts no
PermitTunnel no

UsePAM yes
UseDNS no
PrintMotd no
